function WarehouseScreen({ orders, deleteOrder, updateOrder, addOrder, showToast }) {
  const [season, setSeason] = useState('전체');
  const [type, setType] = useState('전체');
  const [designer, setDesigner] = useState('전체');
  const [sort, setSort] = useState('date-desc');
  const [searchQuery, setSearchQuery] = useState('');

  const designers = useMemo(() => {
    const set = new Set(orders.map((o) => o.designer).filter(Boolean));
    return ['전체', ...Array.from(set).sort((a, b) => a.localeCompare(b))];
  }, [orders]);

  const filtered = useMemo(() => {
    // Only show originals in archive — re-orders are nested into their parent's history
    let r = orders.filter((o) => !o.parentId);
    if (season !== '전체') r = r.filter((o) => o.season === season);
    if (type !== '전체') r = r.filter((o) => o.type === type);
    if (designer !== '전체') r = r.filter((o) => o.designer === designer);
    const q = searchQuery.trim().toLowerCase();
    if (q) r = r.filter((o) => (o.notes || '').toLowerCase().includes(q));
    r = [...r];
    if (sort === 'date-desc') r.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    else if (sort === 'date-asc') r.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
    else if (sort === 'designer') r.sort((a, b) => a.designer.localeCompare(b.designer) || new Date(b.createdAt) - new Date(a.createdAt));
    return r;
  }, [orders, season, type, designer, sort, searchQuery]);

  const grouped = useMemo(() => {
    if (sort !== 'designer') return null;
    const map = new Map();
    filtered.forEach((o) => {
      if (!map.has(o.designer)) map.set(o.designer, []);
      map.get(o.designer).push(o);
    });
    return Array.from(map.entries());
  }, [filtered, sort]);

  return (
    <div className="fade-up space-y-10">
      <PageHeader
        eyebrow="02 · SAMPLE ARCHIVE"
        title="샘플 아카이브"
        sub="전체 발주 샘플 모음 · 어제 이전 완료된 항목이 자동으로 모이는 공간"
        right={
          <div className="flex items-center gap-2 input-blue py-2.5" style={{ width: 'auto' }}>
            <Icon name="sort" className="w-3.5 h-3.5 text-[var(--ink-muted)]" />
            <select value={sort} onChange={(e) => setSort(e.target.value)}
              className="bg-transparent outline-none text-xs text-[var(--ink)] pr-1 cursor-pointer" style={{ fontWeight: 600 }}>
              <option value="date-desc">최근 발주순</option>
              <option value="date-asc">오래된순</option>
              <option value="designer">디자이너별 그룹</option>
            </select>
          </div>
        }
      />

      {/* Search */}
      <section>
        <div className="relative">
          <Icon name="search" className="w-4 h-4 absolute left-4 top-1/2 -translate-y-1/2 text-[var(--ink-muted)]" />
          <input
            type="search"
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            placeholder="비고(제품 스타일) 내용으로 검색…"
            className="input-blue"
            style={{ paddingLeft: 44, paddingRight: searchQuery ? 44 : 16 }}
          />
          {searchQuery && (
            <button type="button" onClick={() => setSearchQuery('')}
              className="absolute right-3 top-1/2 -translate-y-1/2 w-7 h-7 rounded-lg flex items-center justify-center text-[var(--ink-muted)] hover:text-[var(--ink)] hover:bg-[var(--bg-alt)] transition-all"
              aria-label="검색어 지우기">
              <Icon name="x" className="w-3.5 h-3.5" sw={2.2} />
            </button>
          )}
        </div>
        {searchQuery && (
          <p className="text-xs text-[var(--ink-muted)] mt-2 px-1" style={{ fontWeight: 500 }}>
            <span className="text-[var(--blue-deep)]" style={{ fontWeight: 700 }}>"{searchQuery}"</span> 검색 결과 · {filtered.length}건
          </p>
        )}
      </section>

function SampleGrid({ items, allOrders = [], onDelete, onUpdate, onAddOrder, showToast }) {
  const [editing, setEditing] = useState(null); // { id, mode: 'edit' | 'request' }

  const handleSave = (updated) => {
    if (!editing) return;
    if (editing.mode === 'edit') {
      onUpdate(updated);
      showToast('수정이 완료되었어요', 'check', 'blue');
    } else {
      // Request mode: re-order — strip identity fields and link to the source via parentId
      const { id, createdAt, completedAt, parentId: _ignored, ...rest } = updated;
      onAddOrder({
        ...rest,
        parentId: editing.id,
        id: uid(),
        createdAt: new Date().toISOString(),
        completedAt: null,
      });
      showToast('재발주가 샘플감리스트에 추가되었어요', 'plus', 'blue');
    }
    setEditing(null);
  };

  return (
    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 items-start">
      {items.map((o) => (
        editing && editing.id === o.id ? (
          <PendingCardEdit
            key={o.id}
            order={o}
            mode={editing.mode}
            onSave={handleSave}
            onCancel={() => setEditing(null)}
            showToast={showToast}
          />
        ) : (
          <SampleCard
            key={o.id}
            order={o}
            allOrders={allOrders}
            onDelete={onDelete}
            onEdit={() => setEditing({ id: o.id, mode: 'edit' })}
            onRequest={() => setEditing({ id: o.id, mode: 'request' })}
          />
        )
      ))}
    </div>
  );
}

function SampleCard({ order: o, allOrders = [], onDelete, onEdit, onRequest }) {
  const s = SEASON_STYLE[o.season];
  const images = getImages(o);
  const [lbState, setLbState] = useState(null); // null | { initialIdx }
  const [showHistory, setShowHistory] = useState(false);

  // Full 발주 history — original + any re-orders, newest first. Always non-empty (at least the original).
  const children = allOrders.filter((x) => x.parentId === o.id);
  const history = [o, ...children].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  const onClickDelete = () => {
    const childCount = children.length;
    const msg = childCount > 0
      ? `이 항목과 발주 이력 ${childCount}건이 함께 삭제됩니다. 계속하시겠습니까?`

  return (

              aria-label="수정" title="수정">
              <Icon name="pencil" className="w-3.5 h-3.5" />

            <button onClick={onClickDelete}

            </button>

      </div>

        <div className="space-y-1.5" style={{ fontSize: '12.5px' }}>
          <Row k="디자이너" v={o.designer} />

        <div className="pt-3.5 border-t border-[var(--border-soft)]" style={{ minHeight: 56 }}>

          ) : (

          )}
        </div>

        {/* 발주 날짜 확인 — always rendered for uniform card heights */}
        <button type="button" onClick={() => setShowHistory(true)}

            background: 'var(--blue-soft)',

function App() {

  const updateOrder = (updated) => setOrders(orders.map((o) => o.id === updated.id ? updated : o));
  const toggleComplete = (id) => setOrders(orders.map((o) =>
    o.id === id
      ? { ...o, completedAt: o.completedAt ? null : new Date().toISOString() }
      : o
  ));
  const addIdea = (i) => setIdeas([i, ...ideas]);
  const updateIdea = (id, next) => setIdeas(ideas.map((i) => (i.id === id ? next : i)));
  const deleteIdea = (id) => setIdeas(ideas.filter((i) => i.id !== id));

  const tabs = [
    { key: 'order', label: '발주 요청', icon: 'send' },
    { key: 'warehouse', label: '샘플 아카이브', icon: 'archive' },

  return (
    <div className="min-h-screen relative z-10">

      <header className="sticky top-0 z-30 glass-strong">
        <div className="max-w-7xl mx-auto px-5 lg:px-10 py-4 flex flex-wrap items-center justify-between gap-4">
          <BrandLogo />

          <nav className="nav-bar" role="tablist">
            {tabs.map((t) => (
              <button key={t.key} onClick={() => setTab(t.key)}
                className={`nav-tab ${tab === t.key ? 'active' : ''}`}
                role="tab" aria-selected={tab === t.key}>
                <Icon name={t.icon} className="w-[18px] h-[18px]" sw={2.1} />
                <span className="hidden sm:inline">{t.label}</span>
                {t.count > 0 && (
                  <span className="nav-tab-count">{t.count}</span>
                )}
              </button>
            ))}
          </nav>
        </div>
      </header>

      {/* Main */}
      <main className="max-w-7xl mx-auto px-5 lg:px-10 py-12 lg:py-16">
        {tab === 'order' && (
          <OrderScreen orders={orders} addOrder={addOrder} deleteOrder={deleteOrder} toggleComplete={toggleComplete} updateOrder={updateOrder} showToast={showToast} />
        )}
        {tab === 'warehouse' && (
          <WarehouseScreen orders={orders} deleteOrder={deleteOrder} updateOrder={updateOrder} addOrder={addOrder} showToast={showToast} />
        )}
        {tab === 'scrapbook' && (
          <ScrapbookScreen ideas={ideas} addIdea={addIdea} updateIdea={updateIdea} deleteIdea={deleteIdea} showToast={showToast} />
        )}
      </main>

      {/* Footer */}
      <footer className="mt-24 pb-12">
        <div className="max-w-7xl mx-auto px-5 lg:px-10 flex flex-wrap justify-between items-center gap-3 text-xs text-[var(--ink-muted)]">
          <span className="flex items-center gap-2" style={{ fontWeight: 500 }}>
            <span className="w-1.5 h-1.5 rounded-full bg-[var(--blue)] pulse-dot"></span>
            로컬 저장소에 안전하게 저장됨
          </span>
          <span className="font-mono">© 1688 Archive · v2.0</span>
        </div>
      </footer>

      {toastNode}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
