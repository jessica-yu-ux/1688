<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1688 Archive · Kidswear Sourcing</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <style>
    :root {
      /* Electric blue palette */
      --blue: #2563EB;
      --blue-deep: #1D4ED8;
      --blue-dark: #1E3A8A;
      --blue-light: #DBEAFE;
      --blue-soft: #EFF6FF;
      --blue-glow: rgba(37, 99, 235, 0.16);
      --blue-ring: rgba(37, 99, 235, 0.22);

      /* Surfaces */
      --bg: #F8FAFC;
      --bg-alt: #F1F5F9;
      --bg-card: #FFFFFF;

      /* Ink (slate) */
      --ink: #0F172A;
      --ink-soft: #334155;
      --ink-muted: #64748B;
      --ink-faint: #94A3B8;
      --border: #E2E8F0;
      --border-soft: #F1F5F9;

      /* Season chips — keep distinct hues, but cooler/saner */
      --spring: #FCE7F3; --spring-ink: #9D174D;
      --summer: #CFFAFE; --summer-ink: #0E7490;
      --autumn: #FED7AA; --autumn-ink: #9A3412;
      --winter: #E0E7FF; --winter-ink: #3730A3;

      /* Shadows — layered, with blue tint on hover */
      --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.04);
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 2px 4px rgba(15, 23, 42, 0.05), 0 8px 18px -6px rgba(15, 23, 42, 0.10);
      --shadow-lg: 0 4px 8px -2px rgba(15, 23, 42, 0.06), 0 20px 40px -12px rgba(15, 23, 42, 0.14);
      --shadow-blue: 0 4px 8px -2px rgba(37, 99, 235, 0.10), 0 20px 40px -12px rgba(37, 99, 235, 0.25);
      --shadow-blue-sm: 0 2px 6px -1px rgba(37, 99, 235, 0.18), 0 8px 20px -8px rgba(37, 99, 235, 0.30);
    }

    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    html, body {
      font-family: 'Inter', 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      letter-spacing: -0.013em;
      font-weight: 500;
    }
    .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; letter-spacing: -0.01em; }

    /* Subtle dot grid background, faint */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(circle at 1px 1px, rgba(15, 23, 42, 0.045) 1px, transparent 0);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 80%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 80%);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; border: 2px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--blue); }

    /* ───── Surfaces ───── */
    .card-bento {
      background: var(--bg-card);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-soft);
      transition: transform 350ms cubic-bezier(.2,.7,.2,1), box-shadow 350ms ease-out, border-color 350ms ease-out;
    }
    .card-bento-hover:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-blue);
      border-color: var(--blue-light);
    }
    .card-flat {
      background: var(--bg-card);
      border-radius: 20px;
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-xs);
    }

    /* Glassmorphism */
    .glass {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }
    .glass-strong {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }

    /* ───── Buttons ───── */
    .btn-electric {
      background: var(--blue);
      color: white;
      border-radius: 14px;
      padding: 11px 20px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 4px 12px -2px rgba(37, 99, 235, 0.40);
      transition: all 300ms ease-in-out;
      display: inline-flex; align-items: center; gap: 7px;
      cursor: pointer;
    }
    .btn-electric:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 2px 4px rgba(15, 23, 42, 0.06), 0 12px 24px -4px rgba(37, 99, 235, 0.55);
      background: var(--blue-deep);
    }
    .btn-electric:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-dark {
      background: var(--ink);
      color: white;
      border-radius: 14px;
      padding: 11px 20px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      box-shadow: var(--shadow-xs);
      transition: all 300ms ease-in-out;
      display: inline-flex; align-items: center; gap: 7px;
      cursor: pointer;
    }
    .btn-dark:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -6px rgba(15, 23, 42, 0.35);
      background: #1E293B;
    }
    .btn-dark:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.015em;
      transition: all 300ms ease-in-out;
      display: inline-flex; align-items: center; gap: 6px;
      cursor: pointer;
    }
    .btn-glass:hover {
      transform: translateY(-1px);
      border-color: var(--blue);
      color: var(--blue);
      box-shadow: var(--shadow-blue-sm);
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-muted);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.015em;
      transition: all 250ms ease-in-out;
      cursor: pointer;
    }
    .btn-ghost:hover { background: var(--bg-alt); color: var(--ink); }

    /* ───── Inputs ───── */
    .input-blue {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: var(--ink);
      width: 100%;
      transition: all 220ms ease;
      font-family: inherit;
    }
    .input-blue::placeholder { color: var(--ink-faint); }
    .input-blue:hover:not(:focus) { border-color: #CBD5E1; }
    .input-blue:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 4px var(--blue-ring);
      background: white;
    }

    /* ───── Pills ───── */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      line-height: 1.5;
      letter-spacing: -0.01em;
      white-space: nowrap;
      transition: all 220ms ease;
    }
    .pill-btn { cursor: pointer; }
    .pill-btn:hover { transform: translateY(-1px); }

    /* ───── Segmented control ───── */
    .seg-track {
      background: var(--bg-alt);
      border-radius: 14px;
      padding: 4px;
      display: inline-flex;
      gap: 2px;
    }
    .seg-item {
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.015em;
      color: var(--ink-muted);
      transition: all 280ms ease-in-out;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .seg-item:hover { color: var(--ink-soft); }
    .seg-item.active {
      background: var(--bg-card);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
    }
    .seg-item.active-blue {
      background: var(--blue);
      color: white;
      box-shadow: var(--shadow-blue-sm);
    }

    /* ───── Big trendy nav tabs ───── */
    .nav-bar {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border-radius: 24px;
      padding: 6px;
      display: inline-flex;
      gap: 4px;
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow:
        0 8px 24px -8px rgba(15, 23, 42, 0.10),
        0 1px 0 rgba(255, 255, 255, 0.8) inset;
    }
    .nav-tab {
      position: relative;
      padding: 11px 22px;
      border-radius: 18px;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--ink-muted);
      transition: color 220ms ease, background 220ms ease, transform 220ms cubic-bezier(.4,0,.2,1), box-shadow 280ms ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: transparent;
      border: none;
      white-space: nowrap;
    }
    .nav-tab:hover {
      color: var(--ink);
      background: rgba(15, 23, 42, 0.04);
    }
    .nav-tab.active {
      color: white;
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%);
      box-shadow:
        0 10px 24px -8px rgba(37, 99, 235, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.20),
        inset 0 -1px 0 rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }
    .nav-tab.active::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 50%);
      pointer-events: none;
    }
    .nav-tab:active { transform: translateY(0); }
    .nav-tab .nav-tab-count {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: -0.005em;
    }
    .nav-tab.active .nav-tab-count {
      background: rgba(255, 255, 255, 0.22);
      color: white;
    }
    .nav-tab:not(.active) .nav-tab-count {
      background: var(--bg-alt);
      color: var(--ink-muted);
    }

    /* ───── Tag pill input ───── */
    .tag-pill {
      background: var(--blue-soft);
      color: var(--blue-deep);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      display: inline-flex; align-items: center; gap: 4px;
      border: 1px solid var(--blue-light);
    }

    /* ───── Custom check-circle (발주 완료 체크박스) ───── */
    .check-circle {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg-card);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 250ms cubic-bezier(.2,.7,.2,1);
      position: relative;
      padding: 0;
    }
    .check-circle:hover {
      border-color: var(--blue);
      transform: scale(1.08);
      box-shadow: 0 0 0 4px var(--blue-ring);
    }
    .check-circle.checked {
      background: var(--blue);
      border-color: var(--blue);
      box-shadow: 0 4px 12px -2px rgba(37, 99, 235, 0.45);
    }
    .check-circle svg {
      width: 13px;
      height: 13px;
      color: white;
      opacity: 0;
      transform: scale(0.4);
      transition: all 220ms cubic-bezier(.2,.8,.2,1);
    }
    .check-circle.checked svg { opacity: 1; transform: scale(1); }

    /* ───── 1688 link button ───── */
    .btn-1688 {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--blue-soft);
      color: var(--blue-deep);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      border: 1px solid var(--blue-light);
      transition: all 280ms ease-in-out;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn-1688:hover {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px -4px rgba(37, 99, 235, 0.45);
    }

    /* ───── 샘플 요청 button (re-order) ───── */
    .btn-request {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--blue);
      color: white;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.01em;
      border: 1px solid var(--blue);
      transition: all 280ms ease-in-out;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-request:hover {
      background: var(--blue-deep);
      border-color: var(--blue-deep);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px -4px rgba(37, 99, 235, 0.55);
    }

    /* ───── Drag&drop overlay for image upload ───── */
    .drop-active {
      position: relative;
    }
    .drop-active::after {
      content: '여기에 사진을 놓아주세요';
      position: absolute; inset: 0;
      background: rgba(37, 99, 235, 0.10);
      border: 2px dashed var(--blue);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--blue-deep);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.015em;
      pointer-events: none;
      z-index: 10;
      animation: backdropFade 0.18s ease-out;
    }

    /* Hint overlay on hover over thumbnail */
    .thumb-draw-hint {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(15,23,42,0.55) 0%, transparent 55%);
      border-radius: 16px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      color: white;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: -0.005em;
      opacity: 0;
      transition: opacity 220ms ease;
      pointer-events: none;
    }
    .group\/img:hover .thumb-draw-hint { opacity: 1; }

    /* ───── Drawing canvas (annotation tool) ───── */
    .draw-stage {
      position: relative;
      background: var(--bg-alt);
      border-radius: 18px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .draw-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      cursor: crosshair;
      touch-action: none;
    }
    .color-swatch {
      width: 26px; height: 26px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
      border: 2px solid rgba(255,255,255,0.9);
    }
    .color-swatch:hover { transform: scale(1.12); }
    .color-swatch.active {
      transform: scale(1.18);
      box-shadow: 0 0 0 3px var(--blue);
    }

    /* ───── Modal — whole white card scrolls up & down inside the overlay ───── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      z-index: 50;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: auto;
      -webkit-overflow-scrolling: touch;
      animation: backdropFade 0.22s ease-out;
      /* No flex — use block layout so the entire white card scrolls naturally */
    }
    .modal-overlay::-webkit-scrollbar { width: 8px; }
    .modal-overlay::-webkit-scrollbar-track { background: transparent; }
    .modal-overlay::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      transition: background 200ms ease;
    }
    .modal-overlay::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.50); }

    .modal-card {
      background: var(--bg-card);
      border-radius: 28px;
      width: calc(100% - 40px);   /* 20px gap on each side */
      max-width: 680px;
      margin: 40px auto;          /* horizontal center + 40px top/bottom gap */
      box-shadow: 0 32px 64px -16px rgba(15, 23, 42, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.6);
      animation: modalEnter 0.32s cubic-bezier(.2,.8,.2,1);
      /* No max-height, no internal scroll — the entire card scrolls with the overlay */
    }
    .modal-header {
      padding: 24px 28px 18px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .modal-body {
      padding: 24px 28px;
    }
    .modal-footer {
      padding: 16px 28px;
      border-top: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    @keyframes backdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes modalEnter {
      from { opacity: 0; transform: translateY(24px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ───── Dashed upload ───── */
    .dashed-box {
      border: 1.5px dashed #CBD5E1;
      background: var(--bg-alt);
      border-radius: 16px;
      transition: all 250ms ease;
    }
    .dashed-box:hover {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: var(--blue);
    }

    /* ───── Animations ───── */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .5s cubic-bezier(.2,.7,.2,1) both; }

    @keyframes pop { 0% { transform: scale(.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .pop { animation: pop .26s cubic-bezier(.2,.8,.2,1) both; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    .pulse-dot { animation: pulse-dot 2.4s ease-in-out infinite; }

    @keyframes shimmer-blue {
      0%, 100% { box-shadow: 0 0 0 0 var(--blue-glow); }
      50% { box-shadow: 0 0 0 8px transparent; }
    }
    .shimmer-blue { animation: shimmer-blue 3s ease-in-out infinite; }

    /* ───── Toast ───── */
    .toast {
      position: fixed; bottom: 32px; left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: white;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.015em;
      box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.4);
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .toast-blue { background: var(--blue); box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.55); }

    /* ───── Masonry ───── */
    .masonry {
      column-count: 1;
      column-gap: 1.25rem;
    }
    @media (min-width: 640px) { .masonry { column-count: 2; } }
    @media (min-width: 1024px) { .masonry { column-count: 3; } }
    @media (min-width: 1280px) { .masonry { column-count: 4; } }
    .masonry > * {
      break-inside: avoid;
      margin-bottom: 1.25rem;
      display: block;
    }

    /* ───── Pending list row ───── */
    .row-hover { transition: background 200ms ease; border-radius: 14px; }
    .row-hover:hover { background: var(--bg-alt); }

    /* ───── Sample card image overlay ───── */
    .card-shine {
      position: relative;
      overflow: hidden;
    }
    .card-shine::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 50%, rgba(15, 23, 42, 0.08));
      opacity: 0;
      transition: opacity 350ms ease;
      pointer-events: none;
    }
    .card-shine:hover::after { opacity: 1; }

    /* ───── Stat number ───── */
    .stat-number {
      font-feature-settings: 'tnum' 1, 'ss01' 1;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ─────────────────────────────────────────────
   Constants & helpers
   ───────────────────────────────────────────── */

const STORAGE = {
  ORDERS: 'sample_desk_orders_v1',
  IDEAS: 'sample_desk_ideas_v1',
};

const SEASONS = ['봄', '여름', '가을', '겨울', '사계절'];

const formatDate = (iso) => {
  const d = new Date(iso);
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())}`;
};
const formatDateTime = (iso) => {
  const d = new Date(iso);
  return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
};
const relativeTime = (iso) => {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return '방금 전';
  if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
  if (diff < 86400 * 7) return `${Math.floor(diff / 86400)}일 전`;
  return formatDate(iso);
};

const hashStr = (s) => {
  let h = 0;
  for (let i = 0; i < s.length; i++) { h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
  return Math.abs(h);
};

const gradientForId = (id) => {
  const h = hashStr(id || 'x');
  // Bias toward blue/cool gradient for brand cohesion, but keep some variety
  const baseHues = [210, 220, 200, 230, 240, 250, 260, 195, 215, 225];
  const h1 = baseHues[h % baseHues.length];
  const h2 = (h1 + 25 + ((h >> 4) % 35)) % 360;
  return (
    `radial-gradient(at 25% 20%, hsl(${h1}, 70%, 88%) 0%, transparent 55%),` +
    `radial-gradient(at 78% 80%, hsl(${h2}, 65%, 84%) 0%, transparent 55%),` +
    `linear-gradient(135deg, hsl(${h1}, 50%, 94%), hsl(${h2}, 45%, 88%))`
  );
};

const aspectForId = (id) => {
  const ratios = ['4 / 5', '1 / 1', '3 / 4', '4 / 5', '5 / 6', '1 / 1'];
  return ratios[hashStr(id || 'x') % ratios.length];
};

const extractProductId = (url) => {
  const m1 = url.match(/offer\/(\d+)/);
  if (m1) return m1[1];
  const m2 = url.match(/(\d{8,})/);
  if (m2) return m2[1];
  return url.replace(/\W/g, '').slice(-10) || 'item';
};

// Normalize images for backward compat (old data has single `image` field; new has `images` array)
const getImages = (o) => {
  if (Array.isArray(o.images) && o.images.length) return o.images;
  if (o.image) return [o.image];
  return [];
};

async function compressImage(file, maxW = 1000) {  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const ratio = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const useLocalStorage = (key, initial) => {
  const [value, setValue] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch { return initial; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(value)); }
    catch (e) { console.warn('localStorage save failed', e); }
  }, [key, value]);
  return [value, setValue];
};

const useToast = () => {
  const [msg, setMsg] = useState(null);
  const timerRef = useRef(null);
  const show = (m, icon = 'check', variant = 'dark') => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setMsg({ text: m, icon, variant });
    timerRef.current = setTimeout(() => setMsg(null), 2200);
  };
  const node = msg ? (
    <div className={`toast pop ${msg.variant === 'blue' ? 'toast-blue' : ''}`} role="status">
      <Icon name={msg.icon} className="w-3.5 h-3.5" sw={2.2} />
      {msg.text}
    </div>
  ) : null;
  return [node, show];
};

function TagInput({ value, onChange, placeholder }) {
  const [text, setText] = useState('');
  const ref = useRef(null);

  const add = () => {
    const t = text.trim();
    if (!t || value.includes(t)) { setText(''); return; }
    onChange([...value, t]);
    setText('');
  };
  const remove = (i) => onChange(value.filter((_, idx) => idx !== i));

  return (
    <div className="input-blue flex flex-wrap gap-1.5 cursor-text" onClick={() => ref.current && ref.current.focus()}
      style={{ paddingTop: 9, paddingBottom: 9 }}>
      {value.map((tag, i) => (
        <span key={i} className="tag-pill">
          {tag}
          <button type="button" onClick={(e) => { e.stopPropagation(); remove(i); }}
            className="opacity-60 hover:opacity-100 ml-0.5 transition-opacity">
            <Icon name="x" className="w-3 h-3" sw={2.2} />
          </button>
        </span>
      ))}
      <input
        ref={ref}
        type="text"
        value={text}
        onChange={(e) => setText(e.target.value)}
        onKeyDown={(e) => {
          if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(); }
          else if (e.key === 'Backspace' && !text && value.length > 0) remove(value.length - 1);
        }}
        placeholder={value.length === 0 ? placeholder : ''}
        className="flex-1 outline-none bg-transparent text-sm min-w-[140px]"
        style={{ minHeight: 26, fontWeight: 500 }}
      />
    </div>
  );
}

          ) : (
            <button type="button" onClick={() => fileRef.current && fileRef.current.click()}
              className="dashed-box w-36 h-36 flex flex-col items-center justify-center gap-2 text-[var(--ink-muted)]"
              aria-label="이미지 선택">
              {busy ? <Icon name="loader" className="w-5 h-5 spin" /> : (
                <>
                  <Icon name="upload" className="w-5 h-5" />
                  <span className="text-xs" style={{ fontWeight: 600 }}>이미지 선택</span>
                </>
              )}
            </button>
          )}
          <input ref={fileRef} type="file" accept="image/*" className="hidden"
            onChange={(e) => handleFile(e.target.files && e.target.files[0])} />
        </div>
      ) : (
        <div className="flex gap-2.5 items-center">
          <input type="url" value={urlInput}
            onChange={(e) => { setUrlInput(e.target.value); onChange(e.target.value); }}
            placeholder="https://..."
            className="input-blue" />
          {isUrl && (
            <img src={value} alt="" className="w-12 h-12 object-cover rounded-xl flex-shrink-0"
              style={{ boxShadow: 'var(--shadow-xs)' }}
              onError={(e) => { e.target.style.display = 'none'; }} />
          )}
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────
   Multi-image input  (up to N photos)
   ───────────────────────────────────────────── */

function MultiImageInput({ value = [], onChange, max = 5 }) {
  const fileRef = useRef(null);
  const wrapperRef = useRef(null);
  const valueRef = useRef(value);
  useEffect(() => { valueRef.current = value; }, [value]);

  const [busy, setBusy] = useState(false);
  const [urlInput, setUrlInput] = useState('');
  const [dragging, setDragging] = useState(false);
  const [drawIdx, setDrawIdx] = useState(null);
  const [reorderFrom, setReorderFrom] = useState(null);

  const addFiles = async (files) => {
    if (!files || files.length === 0) return;
    const arr = Array.from(files).filter((f) => f.type && f.type.startsWith('image/'));
    if (arr.length === 0) return;
    setBusy(true);
    try {
      const slots = max - valueRef.current.length;
      if (slots <= 0) {
        alert(`사진은 최대 ${max}장까지 등록할 수 있어요`);
        return;
      }
      const toAdd = arr.slice(0, slots);
      const compressed = await Promise.all(toAdd.map((f) => compressImage(f, 1000)));
      onChange([...valueRef.current, ...compressed]);
    } catch (e) {
      console.error(e);
      alert('이미지 처리 중 오류가 발생했습니다.');
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = '';
    }
  };

  const addUrl = () => {
    const url = urlInput.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) {
      alert('http:// 또는 https:// 로 시작하는 URL을 입력해주세요');
      return;
    }
    if (value.length >= max) {
      alert(`사진은 최대 ${max}장까지 등록할 수 있어요`);
      return;
    }
    onChange([...value, url]);
    setUrlInput('');
  };

  const remove = (idx) => onChange(value.filter((_, i) => i !== idx));
  const move = (idx, dir) => {
    const j = idx + dir;
    if (j < 0 || j >= value.length) return;
    const next = [...value];
    [next[idx], next[j]] = [next[j], next[idx]];
    onChange(next);
  };
  const reorder = (from, to) => {
    if (from === to || from < 0 || to < 0 || from >= value.length || to >= value.length) return;
    const next = [...value];
    const [moved] = next.splice(from, 1);
    next.splice(to, 0, moved);
    onChange(next);
  };

  const updateAt = (idx, newSrc) => {
    const next = [...value];
    next[idx] = newSrc;
    onChange(next);
  };

  // Paste handler — scoped to when focus is within this wrapper
  useEffect(() => {
    const handlePaste = (e) => {
      const wrap = wrapperRef.current;
      if (!wrap) return;
      const active = document.activeElement;
      if (active && active !== document.body && !wrap.contains(active)) return;
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      const imageFiles = Array.from(items)
        .filter((item) => item.type && item.type.startsWith('image/'))
        .map((item) => item.getAsFile())
        .filter(Boolean);
      if (imageFiles.length > 0) {
        e.preventDefault();
        addFiles(imageFiles);
      }
    };
    document.addEventListener('paste', handlePaste);
    return () => document.removeEventListener('paste', handlePaste);
  }, []);

  const onWrapDragOver = (e) => {
    if (reorderFrom !== null) return;  // thumbnail reorder in progress
    if (!e.dataTransfer || !e.dataTransfer.types || !Array.from(e.dataTransfer.types).includes('Files')) return;
    e.preventDefault();
    e.stopPropagation();
    if (!dragging) setDragging(true);
  };
  const onWrapDragLeave = (e) => {
    if (e.currentTarget.contains(e.relatedTarget)) return;
    setDragging(false);
  };
  const onWrapDrop = (e) => {
    if (!e.dataTransfer) return;
    if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      e.preventDefault();
      e.stopPropagation();
      setDragging(false);
      addFiles(e.dataTransfer.files);
    }
  };

  const remaining = max - value.length;
  const urlDisabled = remaining === 0;

  return (
    <div ref={wrapperRef} className={`space-y-3 ${dragging ? 'drop-active' : ''}`}
      onDragOver={onWrapDragOver}
      onDragLeave={onWrapDragLeave}
      onDrop={onWrapDrop}>
      {/* URL input — placed BEFORE the upload thumbnails */}
      <div className="flex gap-2">
        <div className="relative flex-1 min-w-0">
          <Icon name="external" className="w-3.5 h-3.5 absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--ink-muted)] pointer-events-none" />
          <input type="url" value={urlInput}
            onChange={(e) => setUrlInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addUrl(); } }}
            placeholder={urlDisabled ? "사진 최대 개수 도달" : "이미지 URL 붙여넣기 (https://...)"}
            disabled={urlDisabled}
            className="input-blue text-xs"
            style={{ paddingLeft: 38, paddingTop: 9, paddingBottom: 9, fontFamily: "'JetBrains Mono', ui-monospace, monospace" }} />
        </div>
        <button type="button" onClick={addUrl}
          disabled={!urlInput.trim() || urlDisabled}
          className="btn-electric flex-shrink-0"
          style={{ padding: '9px 16px', fontSize: 12 }}>
          <Icon name="plus" className="w-3 h-3" sw={2.4} />
          URL 추가
        </button>
      </div>

      {/* Thumbnails + upload box */}
      <div className="flex flex-wrap gap-2">
        {value.map((src, i) => (
          <div key={`${i}-${src.slice(0, 32)}`}
            className="relative group/img cursor-pointer"
            draggable
            onDragStart={(e) => {
              setReorderFrom(i);
              e.dataTransfer.effectAllowed = 'move';
              try { e.dataTransfer.setData('text/plain', String(i)); } catch {}
            }}
            onDragEnd={() => setReorderFrom(null)}
            onDragOver={(e) => {
              if (reorderFrom === null) return;
              e.preventDefault();
              e.stopPropagation();
              e.dataTransfer.dropEffect = 'move';
            }}
            onDrop={(e) => {
              if (reorderFrom === null) return;
              e.preventDefault();
              e.stopPropagation();
              reorder(reorderFrom, i);
              setReorderFrom(null);
            }}
            onClick={(e) => {
              if (e.target.closest('[data-stop]')) return;
              setDrawIdx(i);
            }}>
            <img src={src} alt="" className="w-24 h-24 object-cover rounded-2xl block"
              style={{ boxShadow: 'var(--shadow-sm)', opacity: reorderFrom === i ? 0.4 : 1 }}
              draggable={false}
              onError={(e) => { e.target.style.opacity = '0.3'; }} />
            {i === 0 && (
              <span className="absolute top-1.5 left-1.5 pill" data-stop
                style={{ background: 'var(--blue)', color: 'white', padding: '2px 7px', fontSize: 9, lineHeight: 1.3 }}>
                대표
              </span>
            )}
            <button type="button" data-stop
              onClick={(e) => { e.stopPropagation(); remove(i); }}
              className="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-[var(--ink)] text-white flex items-center justify-center hover:scale-110 transition-transform"
              style={{ boxShadow: '0 4px 10px -2px rgba(15,23,42,0.35)' }}
              aria-label="사진 삭제">
              <Icon name="x" className="w-3 h-3" sw={2.4} />
            </button>
            {/* Hover hint */}
            <div className="thumb-draw-hint">클릭해서 그리기</div>
            {/* Reorder arrows on hover */}
            {value.length > 1 && (
              <div className="absolute top-1.5 right-1.5 flex flex-col gap-0.5 opacity-0 group-hover/img:opacity-100 transition-opacity" data-stop>
                {i > 0 && (
                  <button type="button" data-stop
                    onClick={(e) => { e.stopPropagation(); move(i, -1); }}
                    className="w-5 h-5 rounded-md bg-white/95 text-[var(--ink)] flex items-center justify-center hover:bg-[var(--blue)] hover:text-white transition-all"
                    style={{ marginRight: 18 }}
                    aria-label="앞으로" title="앞으로 (대표로 이동)">
                    <Icon name="prev" className="w-3 h-3" sw={2.4} style={{ transform: 'rotate(90deg)' }} />
                  </button>
                )}
                {i < value.length - 1 && (
                  <button type="button" data-stop
                    onClick={(e) => { e.stopPropagation(); move(i, 1); }}
                    className="w-5 h-5 rounded-md bg-white/95 text-[var(--ink)] flex items-center justify-center hover:bg-[var(--blue)] hover:text-white transition-all"
                    style={{ marginRight: 18 }}
                    aria-label="뒤로" title="뒤로">
                    <Icon name="next" className="w-3 h-3" sw={2.4} style={{ transform: 'rotate(90deg)' }} />
                  </button>
                )}
              </div>
            )}
          </div>
        ))}
        {value.length < max && (
          <button type="button" onClick={() => fileRef.current && fileRef.current.click()}
            className="dashed-box w-24 h-24 flex flex-col items-center justify-center gap-1 text-[var(--ink-muted)]"
            aria-label="이미지 추가">
            {busy ? <Icon name="loader" className="w-4 h-4 spin" /> : (
              <>
                <Icon name="upload" className="w-4 h-4" sw={2} />
                <span className="text-[10px]" style={{ fontWeight: 600 }}>
                  {value.length === 0 ? '파일 업로드' : '추가'}
                </span>
                <span className="text-[9px] font-mono opacity-70">{value.length}/{max}</span>
              </>
            )}
          </button>
        )}
      </div>
      <input ref={fileRef} type="file" accept="image/*" multiple className="hidden"
        onChange={(e) => addFiles(e.target.files)} />
      <p className="text-[10px] text-[var(--ink-faint)] leading-relaxed" style={{ fontWeight: 500 }}>
        ✦ 사진 위에 그리려면 클릭 · 순서 변경은 드래그 또는 호버 시 화살표 · 클립보드에서 붙여넣기 · 파일을 끌어다 놓기 모두 지원해요
      </p>

      {/* Drawing modal */}
      {drawIdx !== null && value[drawIdx] && (
        <DrawingModal
          src={value[drawIdx]}
          onClose={() => setDrawIdx(null)}
          onSave={(newSrc) => { updateAt(drawIdx, newSrc); setDrawIdx(null); }}
        />
      )}
    </div>
  );
}

function ImageCarousel({ images, fallbackBg, fallbackType, onImageClick }) {
  const [idx, setIdx] = useState(0);
  const total = images.length;
  const safeIdx = total > 0 ? Math.min(idx, total - 1) : 0;

  const prev = (e) => { e.preventDefault(); e.stopPropagation(); setIdx((safeIdx - 1 + total) % total); };
  const next = (e) => { e.preventDefault(); e.stopPropagation(); setIdx((safeIdx + 1) % total); };

  if (total === 0) {
    return (
      <div className="w-full h-full flex items-center justify-center" style={{ color: 'var(--ink-faint)' }}>
        <div className="text-center opacity-60">
          <Icon name="image" className="w-8 h-8 mx-auto mb-1.5" />
          {fallbackType && <p className="text-[10px]" style={{ fontWeight: 600 }}>{fallbackType}</p>}
        </div>
      </div>
    );
  }

  return (
    <>
      <img src={images[safeIdx]} alt="" key={safeIdx}
        className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
        style={{ cursor: onImageClick ? 'zoom-in' : 'default' }}
        onClick={onImageClick ? () => onImageClick(safeIdx) : undefined}
        onError={(e) => { e.target.style.opacity = '0'; }} />
      {total > 1 && (
        <>
          {/* Counter pill (top-right) */}
          <span className="absolute top-3 right-3 pill z-10 pointer-events-none"
            style={{ background: 'rgba(15, 23, 42, 0.65)', color: 'white', backdropFilter: 'blur(8px)', padding: '3px 9px', fontSize: 10 }}>
            {safeIdx + 1} / {total}
          </span>
          {/* Prev */}
          <button type="button" onClick={prev}
            className="absolute left-2.5 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full flex items-center justify-center text-[var(--ink)] opacity-0 group-hover:opacity-100 hover:scale-110 transition-all z-10"
            style={{ background: 'rgba(255,255,255,0.92)', backdropFilter: 'blur(8px)', boxShadow: 'var(--shadow-md)' }}
            aria-label="이전 사진">
            <Icon name="prev" className="w-4 h-4" sw={2.4} />
          </button>
          {/* Next */}
          <button type="button" onClick={next}
            className="absolute right-2.5 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full flex items-center justify-center text-[var(--ink)] opacity-0 group-hover:opacity-100 hover:scale-110 transition-all z-10"
            style={{ background: 'rgba(255,255,255,0.92)', backdropFilter: 'blur(8px)', boxShadow: 'var(--shadow-md)' }}
            aria-label="다음 사진">
            <Icon name="next" className="w-4 h-4" sw={2.4} />
          </button>
          {/* Dots */}
          <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1 z-10">
            {images.map((_, i) => (
              <button key={i} type="button"
                onClick={(e) => { e.preventDefault(); e.stopPropagation(); setIdx(i); }}
                className={`h-1.5 rounded-full transition-all ${i === safeIdx ? 'w-5 bg-white' : 'w-1.5 bg-white/55 hover:bg-white/85'}`}
                aria-label={`사진 ${i + 1}`} />
            ))}
          </div>
        </>
      )}
    </>
  );
}

/* ─────────────────────────────────────────────
   Lightbox  (fullscreen image viewer)
   ───────────────────────────────────────────── */

function LightboxModal({ images, initialIdx = 0, onClose }) {
  const [idx, setIdx] = useState(Math.min(initialIdx, images.length - 1));
  const [zoom, setZoom] = useState(1);
  const [pan, setPan] = useState({ x: 0, y: 0 });
  const dragRef = useRef(null);
  const total = images.length;
  const ZOOM_MIN = 0.5, ZOOM_MAX = 4, ZOOM_STEP = 0.25;

  const resetView = () => { setZoom(1); setPan({ x: 0, y: 0 }); };
  const zoomIn = () => setZoom((z) => Math.min(ZOOM_MAX, +(z + ZOOM_STEP).toFixed(2)));
  const zoomOut = () => setZoom((z) => {
    const nz = Math.max(ZOOM_MIN, +(z - ZOOM_STEP).toFixed(2));
    if (nz === 1) setPan({ x: 0, y: 0 });
    return nz;
  });

  // Reset zoom/pan when switching images
  useEffect(() => { resetView(); }, [idx]);

  useEffect(() => {
    const handler = (e) => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowLeft') setIdx((i) => (i - 1 + total) % total);
      else if (e.key === 'ArrowRight') setIdx((i) => (i + 1) % total);
      else if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomIn(); }
      else if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomOut(); }
      else if (e.key === '0') { e.preventDefault(); resetView(); }
    };
    document.addEventListener('keydown', handler);
    // Lock background page scroll while popup is open
    const prevOverflow = document.body.style.overflow;
    const prevPaddingRight = document.body.style.paddingRight;
    const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
    document.body.style.overflow = 'hidden';
    if (scrollbarWidth > 0) {
      document.body.style.paddingRight = `${scrollbarWidth}px`;
    }
    return () => {
      document.removeEventListener('keydown', handler);
      document.body.style.overflow = prevOverflow;
      document.body.style.paddingRight = prevPaddingRight;
    };
  }, [total, onClose]);

  const onWheel = (e) => {
    e.preventDefault();
    if (e.deltaY < 0) zoomIn();
    else zoomOut();
  };

  const onMouseDown = (e) => {
    if (zoom <= 1) return;
    e.preventDefault();
    dragRef.current = { startX: e.clientX, startY: e.clientY, originX: pan.x, originY: pan.y };
  };
  const onMouseMove = (e) => {
    if (!dragRef.current) return;
    const { startX, startY, originX, originY } = dragRef.current;
    setPan({ x: originX + (e.clientX - startX), y: originY + (e.clientY - startY) });
  };
  const onMouseUp = () => { dragRef.current = null; };

  if (total === 0) return null;

  return ReactDOM.createPortal((
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" style={{ maxWidth: 880 }} onClick={(e) => e.stopPropagation()}>
        <header className="modal-header">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-xl bg-[var(--blue-soft)] text-[var(--blue)] flex items-center justify-center">
              <Icon name="image" className="w-4 h-4" sw={2} />
            </div>
            <div>
              <h3 className="text-base text-[var(--ink)]" style={{ fontWeight: 700, letterSpacing: '-0.025em' }}>샘플 사진 보기</h3>
              <p className="text-[10.5px] text-[var(--ink-muted)] mt-0.5" style={{ fontWeight: 500 }}>
                <span className="font-mono">{idx + 1} / {total}</span>
                {total > 1 && ' · ←→ 이전·다음'} · +/− 확대축소 · ESC 닫기
              </p>
            </div>
          </div>
          <button type="button" onClick={onClose}
            className="w-9 h-9 rounded-xl flex items-center justify-center text-[var(--ink-muted)] hover:bg-[var(--bg-alt)] hover:text-[var(--ink)] transition-all"
            aria-label="닫기">
            <Icon name="x" className="w-4 h-4" sw={2} />
          </button>
        </header>

        <div className="modal-body" style={{ padding: 0 }}
          onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}>
          <div className="relative overflow-hidden" style={{ aspectRatio: '4 / 3', background: 'var(--bg-alt)' }}>
            <img src={images[idx]} alt="" key={idx}
              draggable={false}
              onWheel={onWheel}
              onMouseDown={onMouseDown}
              className="absolute inset-0 w-full h-full object-contain"
              style={{
                transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})`,
                transition: dragRef.current ? 'none' : 'transform 220ms cubic-bezier(.2,.8,.2,1)',
                cursor: zoom > 1 ? (dragRef.current ? 'grabbing' : 'grab') : 'default',
                userSelect: 'none',
              }}
              onError={(e) => { e.target.style.opacity = '0.3'; }} />

            {total > 1 && (
              <>
                <button type="button"
                  onClick={(e) => { e.stopPropagation(); setIdx((idx - 1 + total) % total); }}
                  className="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full glass flex items-center justify-center text-[var(--ink)] hover:scale-110 transition-all z-10"
                  style={{ boxShadow: 'var(--shadow-md)' }}
                  aria-label="이전 사진">
                  <Icon name="prev" className="w-4 h-4" sw={2.2} />
                </button>
                <button type="button"
                  onClick={(e) => { e.stopPropagation(); setIdx((idx + 1) % total); }}
                  className="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full glass flex items-center justify-center text-[var(--ink)] hover:scale-110 transition-all z-10"
                  style={{ boxShadow: 'var(--shadow-md)' }}
                  aria-label="다음 사진">
                  <Icon name="next" className="w-4 h-4" sw={2.2} />
                </button>
                <div className="absolute bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5 z-10">
                  {images.map((_, i) => (
                    <button key={i} type="button" onClick={(e) => { e.stopPropagation(); setIdx(i); }}
                      className={`h-1.5 rounded-full transition-all ${i === idx ? 'w-5 bg-[var(--blue)]' : 'w-1.5 bg-white/90 hover:bg-white'}`}
                      style={{ boxShadow: '0 0 0 1px rgba(0,0,0,0.08)' }}
                      aria-label={`사진 ${i + 1}`} />
                  ))}
                </div>
              </>
            )}
          </div>
        </div>

        <footer className="modal-footer">
          {/* Zoom controls (left) */}
          <div className="flex items-center gap-1">
            <button type="button" onClick={zoomOut} disabled={zoom <= ZOOM_MIN + 0.001}
              className="w-8 h-8 rounded-lg flex items-center justify-center text-[var(--ink-soft)] hover:bg-[var(--bg-alt)] hover:text-[var(--ink)] disabled:opacity-40 disabled:cursor-not-allowed transition-all"
              aria-label="축소" title="축소 (−)">
              <span style={{ fontSize: 18, fontWeight: 700, lineHeight: 1 }}>−</span>
            </button>
            <button type="button" onClick={resetView}
              className="px-3 py-1.5 rounded-lg text-xs font-mono text-[var(--ink-soft)] hover:bg-[var(--bg-alt)] transition-all"
              style={{ fontWeight: 600, minWidth: 60, textAlign: 'center' }}
              title="원래 크기 (0)">
              {Math.round(zoom * 100)}%
            </button>
            <button type="button" onClick={zoomIn} disabled={zoom >= ZOOM_MAX - 0.001}
              className="w-8 h-8 rounded-lg flex items-center justify-center text-[var(--ink-soft)] hover:bg-[var(--bg-alt)] hover:text-[var(--ink)] disabled:opacity-40 disabled:cursor-not-allowed transition-all"
              aria-label="확대" title="확대 (+)">
              <span style={{ fontSize: 18, fontWeight: 700, lineHeight: 1 }}>+</span>
            </button>
          </div>
          {/* Close (right) */}
          <button type="button" onClick={onClose} className="btn-ghost"
            style={{ padding: '7px 14px', fontSize: 12 }}>
            닫기
          </button>
        </footer>
      </div>
    </div>
  ), document.body);
}


/* ─────────────────────────────────────────────
   Drawing modal  (annotate photo with strokes)
   ───────────────────────────────────────────── */

function DrawingModal({ src, onSave, onClose, showToast }) {
  // currentSrc tracks the (possibly rotated) image we work on
  const [currentSrc, setCurrentSrc] = useState(src);
  const canvasRef = useRef(null);
  const [strokes, setStrokes] = useState([]);
  const drawingRef = useRef(null);
  const [, forceRedraw] = useState(0);
  const [tool, setTool] = useState('brush');  // 'brush' | 'eraser'
  const [color, setColor] = useState('#DC2626');
  const [brushSize, setBrushSize] = useState(5);
  const [imgDim, setImgDim] = useState({ w: 0, h: 0 });
  const [saving, setSaving] = useState(false);
  const [rotating, setRotating] = useState(false);

  const COLORS = ['#DC2626', '#EAB308', '#22C55E', '#2563EB', '#0F172A'];

  // Whenever currentSrc changes, refresh image dimensions
  useEffect(() => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => setImgDim({ w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => setImgDim({ w: 1000, h: 750 });
    img.src = currentSrc;
  }, [currentSrc]);

  const render = () => {
    const canvas = canvasRef.current;
    if (!canvas || imgDim.w === 0) return;
    if (canvas.width !== imgDim.w) canvas.width = imgDim.w;
    if (canvas.height !== imgDim.h) canvas.height = imgDim.h;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const all = drawingRef.current ? [...strokes, drawingRef.current] : strokes;
    all.forEach((s) => {
      if (!s.points || s.points.length === 0) return;
      if (s.tool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = s.color;
        ctx.fillStyle = s.color;
      }
      ctx.lineWidth = s.size;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (s.points.length === 1) {
        const p = s.points[0];
        ctx.beginPath();
        ctx.arc(p.x, p.y, s.size / 2, 0, Math.PI * 2);
        if (s.tool === 'eraser') ctx.fill();
        else ctx.fill();
      } else {
        ctx.beginPath();
        s.points.forEach((p, i) => {
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
      }
    });
    ctx.globalCompositeOperation = 'source-over';
  };

  useEffect(() => { render(); }, [strokes, imgDim]);

  // ESC to close — page scroll stays unlocked so the background page can scroll too
  useEffect(() => {
    const h = (e) => { if (e.key === 'Escape' && !saving && !rotating) onClose(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [onClose, saving, rotating]);

  const getPos = (clientX, clientY) => {
    const canvas = canvasRef.current;
    if (!canvas) return { x: 0, y: 0 };
    const rect = canvas.getBoundingClientRect();
    return {
      x: ((clientX - rect.left) / rect.width) * imgDim.w,
      y: ((clientY - rect.top) / rect.height) * imgDim.h,
    };
  };

  const start = (clientX, clientY) => {
    drawingRef.current = {
      tool,
      color,
      size: tool === 'eraser' ? brushSize * 1.6 : brushSize,
      points: [getPos(clientX, clientY)],
    };
    forceRedraw((n) => n + 1);
    render();
  };
  const move = (clientX, clientY) => {
    if (!drawingRef.current) return;
    drawingRef.current.points.push(getPos(clientX, clientY));
    render();
  };
  const end = () => {
    if (!drawingRef.current) return;
    const s = drawingRef.current;
    drawingRef.current = null;
    if (s.points.length > 0) setStrokes((prev) => [...prev, s]);
    else render();
  };

  const undo = () => setStrokes((prev) => prev.slice(0, -1));
  const clear = () => setStrokes([]);

  const rotate90 = async () => {
    setRotating(true);
    try {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise((res, rej) => {
        img.onload = res;
        img.onerror = () => rej(new Error('image load failed'));
        img.src = currentSrc;
      });
      const out = document.createElement('canvas');
      out.width = img.naturalHeight;
      out.height = img.naturalWidth;
      const octx = out.getContext('2d');
      octx.translate(out.width, 0);
      octx.rotate(Math.PI / 2);
      octx.drawImage(img, 0, 0);
      let dataUrl;
      try {
        dataUrl = out.toDataURL('image/jpeg', 0.92);
      } catch (corsErr) {
        alert('외부 URL 이미지는 CORS 제한으로 회전이 어려울 수 있어요. 업로드된 사진을 사용해주세요.');
        return;
      }
      // Clear strokes since coordinates no longer match
      setStrokes([]);
      drawingRef.current = null;
      setCurrentSrc(dataUrl);
    } catch (e) {
      console.error(e);
      alert('회전 중 오류가 발생했습니다.');
    } finally {
      setRotating(false);
    }
  };

  const save = async () => {
    setSaving(true);
    try {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise((res, rej) => {
        img.onload = res;
        img.onerror = () => rej(new Error('image load failed'));
        img.src = currentSrc;
      });
      const out = document.createElement('canvas');
      out.width = img.naturalWidth || imgDim.w;
      out.height = img.naturalHeight || imgDim.h;
      const octx = out.getContext('2d');
      octx.drawImage(img, 0, 0, out.width, out.height);
      if (canvasRef.current) octx.drawImage(canvasRef.current, 0, 0, out.width, out.height);
      let dataUrl;
      try {
        dataUrl = out.toDataURL('image/jpeg', 0.9);
      } catch (corsErr) {
        alert('외부 URL 이미지는 CORS 제한으로 저장이 어려울 수 있어요. 업로드된 사진을 사용해주세요.');
        setSaving(false);
        return;
      }
      onSave(dataUrl);
      if (showToast) showToast('그림이 저장되었어요', 'check', 'blue');
    } catch (e) {
      console.error(e);
      alert('저장 중 오류가 발생했습니다.');
    } finally {
      setSaving(false);
    }
  };

  return ReactDOM.createPortal((
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget && !saving && !rotating) onClose(); }}>
      <div className="modal-card" style={{ maxWidth: 980 }} onClick={(e) => e.stopPropagation()}>
        <header className="modal-header">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-xl bg-[var(--blue-soft)] text-[var(--blue)] flex items-center justify-center">
              <Icon name="pencil" className="w-4 h-4" sw={2} />
            </div>
            <div>
              <h3 className="text-base text-[var(--ink)]" style={{ fontWeight: 700, letterSpacing: '-0.025em' }}>사진에 그리기</h3>
              <p className="text-[10.5px] text-[var(--ink-muted)] mt-0.5" style={{ fontWeight: 500 }}>브러시·지우개·회전 도구로 사진을 편집할 수 있어요</p>
            </div>
          </div>
          <button type="button" onClick={onClose} disabled={saving || rotating}
            className="w-9 h-9 rounded-xl flex items-center justify-center text-[var(--ink-muted)] hover:bg-[var(--bg-alt)] hover:text-[var(--ink)] transition-all"
            aria-label="닫기">
            <Icon name="x" className="w-4 h-4" sw={2} />
          </button>
        </header>

        <div className="modal-body">
          {/* Toolbar */}
          <div className="space-y-3 mb-4 pb-4 border-b border-[var(--border-soft)]">
            {/* Row 1: tool toggle + rotate */}
            <div className="flex items-center gap-3 flex-wrap">
              <div className="seg-track" style={{ background: 'var(--bg-alt)', padding: 3 }}>
                <button type="button" onClick={() => setTool('brush')}
                  className={`seg-item ${tool === 'brush' ? 'active-blue' : ''}`}
                  style={{ padding: '7px 14px', fontSize: 12 }}>
                  <Icon name="pencil" className="w-3.5 h-3.5" sw={2.2} />
                  브러시
                </button>
                <button type="button" onClick={() => setTool('eraser')}
                  className={`seg-item ${tool === 'eraser' ? 'active-blue' : ''}`}
                  style={{ padding: '7px 14px', fontSize: 12 }}>
                  <Icon name="eraser" className="w-3.5 h-3.5" sw={2.2} />
                  지우개
                </button>
              </div>
              <button type="button" onClick={rotate90} disabled={rotating || saving}
                className="btn-ghost disabled:opacity-40 disabled:cursor-not-allowed"
                style={{ padding: '7px 12px', fontSize: 12 }}
                title="90° 회전">
                {rotating ? (
                  <Icon name="loader" className="w-3.5 h-3.5 spin" />
                ) : (
                  <Icon name="rotate" className="w-3.5 h-3.5" sw={2.2} />
                )}
                90° 회전
              </button>
              <div className="ml-auto flex items-center gap-1.5">
                <button type="button" onClick={undo} disabled={strokes.length === 0}
                  className="btn-ghost disabled:opacity-40 disabled:cursor-not-allowed" style={{ padding: '7px 12px', fontSize: 12 }}>
                  <Icon name="arrow" className="w-3 h-3" sw={2.2} style={{ transform: 'rotate(180deg)' }} />
                  되돌리기
                </button>
                <button type="button" onClick={clear} disabled={strokes.length === 0}
                  className="btn-ghost disabled:opacity-40 disabled:cursor-not-allowed" style={{ padding: '7px 12px', fontSize: 12 }}>
                  <Icon name="trash" className="w-3 h-3" sw={2.2} />
                  전체 지우기
                </button>
              </div>
            </div>
            {/* Row 2: color + brush size */}
            <div className="flex items-center gap-4 flex-wrap">
              <div className="flex items-center gap-2" style={{ opacity: tool === 'eraser' ? 0.4 : 1 }}>
                <span className="text-[10.5px] uppercase tracking-wider text-[var(--ink-muted)]" style={{ fontWeight: 700 }}>색상</span>
                <div className="flex items-center gap-1.5">
                  {COLORS.map((c) => (
                    <button key={c} type="button" onClick={() => { setColor(c); setTool('brush'); }}
                      className={`color-swatch ${color === c && tool === 'brush' ? 'active' : ''}`}
                      style={{ background: c }} aria-label={`색상 ${c}`} />
                  ))}
                </div>
              </div>
              <div className="flex items-center gap-2.5">
                <span className="text-[10.5px] uppercase tracking-wider text-[var(--ink-muted)]" style={{ fontWeight: 700 }}>굵기</span>
                <input type="range" min={2} max={36} value={brushSize}
                  onChange={(e) => setBrushSize(+e.target.value)}
                  className="w-28 accent-[var(--blue)]" />
                <span className="text-xs font-mono text-[var(--ink-soft)] w-9 text-right" style={{ fontWeight: 600 }}>{brushSize}px</span>
              </div>
            </div>
          </div>

          {/* Canvas stage */}
          <div className="draw-stage" style={{ aspectRatio: imgDim.w && imgDim.h ? `${imgDim.w} / ${imgDim.h}` : '4 / 3', maxHeight: '55vh' }}>
            <img src={currentSrc} alt=""
              className="absolute inset-0 w-full h-full object-contain pointer-events-none"
              draggable={false}
              onError={(e) => { e.target.style.opacity = '0.3'; }} />
            <canvas ref={canvasRef}
              className="draw-canvas"
              style={{ cursor: tool === 'eraser' ? 'cell' : 'crosshair' }}
              onMouseDown={(e) => { e.preventDefault(); start(e.clientX, e.clientY); }}
              onMouseMove={(e) => { if (drawingRef.current) move(e.clientX, e.clientY); }}
              onMouseUp={end}
              onMouseLeave={end}
              onTouchStart={(e) => { e.preventDefault(); const t = e.touches[0]; start(t.clientX, t.clientY); }}
              onTouchMove={(e) => { e.preventDefault(); const t = e.touches[0]; move(t.clientX, t.clientY); }}
              onTouchEnd={end} />
          </div>
          <p className="text-[10.5px] text-[var(--ink-faint)] mt-2.5" style={{ fontWeight: 500 }}>
            ✦ 모달 창 전체를 위·아래로 스크롤해서 모든 도구를 확인할 수 있어요 · ESC 키로 닫기
          </p>
        </div>

        <footer className="modal-footer">
          <p className="text-[11px] text-[var(--ink-faint)] font-mono" style={{ fontWeight: 500 }}>
            {strokes.length > 0 ? `${strokes.length}개 획` : '획 없음'}
          </p>
          <div className="flex items-center gap-2">
            <button type="button" onClick={onClose} disabled={saving || rotating} className="btn-ghost">취소</button>
            <button type="button" onClick={save} disabled={saving || rotating} className="btn-electric disabled:opacity-50">
              {saving ? <Icon name="loader" className="w-3.5 h-3.5 spin" /> : <Icon name="check" className="w-3.5 h-3.5" sw={2.4} />}
              {saving ? '저장 중…' : '저장'}
            </button>
          </div>
        </footer>
      </div>
    </div>
  ), document.body);
}


/* ─────────────────────────────────────────────
   Order History Modal — popup view of all 발주 events for one product
   ───────────────────────────────────────────── */

function OrderHistoryModal({ history, originalId, onClose }) {
  // Body scroll lock with scrollbar-width compensation
  useEffect(() => {
    const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handleKey);
    const prevOverflow = document.body.style.overflow;
    const prevPad = document.body.style.paddingRight;
    const sbw = window.innerWidth - document.documentElement.clientWidth;
    document.body.style.overflow = 'hidden';
    if (sbw > 0) document.body.style.paddingRight = `${sbw}px`;
    return () => {
      document.removeEventListener('keydown', handleKey);
      document.body.style.overflow = prevOverflow;
      document.body.style.paddingRight = prevPad;
    };
  }, [onClose]);

  const fmtDateTime = (iso) => {
    const d = new Date(iso);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mi = String(d.getMinutes()).padStart(2, '0');
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    return `${yyyy}.${mm}.${dd} (${days[d.getDay()]}) ${hh}:${mi}`;
  };

  const original = history.find((h) => h.id === originalId);

  return ReactDOM.createPortal((
    <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="modal-card" style={{ maxWidth: 640 }} onClick={(e) => e.stopPropagation()}>
        <header className="modal-header">
          <div className="flex items-center gap-3">
            <div className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
              style={{ background: 'var(--blue-soft)', color: 'var(--blue)' }}>
              <Icon name="calendar" className="w-4 h-4" sw={2} />
            </div>
            <div>
              <h3 className="text-base text-[var(--ink)]" style={{ fontWeight: 800, letterSpacing: '-0.025em' }}>
                발주 날짜 확인
              </h3>
              <p className="text-[11px] text-[var(--ink-muted)] mt-0.5" style={{ fontWeight: 500 }}>
                {original ? `${original.season} · ${original.type}` : ''}
                <span className="mx-1.5 text-[var(--ink-faint)]">·</span>
                <span className="text-[var(--blue-deep)] font-mono" style={{ fontWeight: 700 }}>총 {history.length}건</span>
              </p>
            </div>
          </div>
          <button type="button" onClick={onClose}
            className="w-9 h-9 rounded-xl flex items-center justify-center text-[var(--ink-muted)] hover:bg-[var(--bg-alt)] hover:text-[var(--ink)] transition-all"
            aria-label="닫기">
            <Icon name="x" className="w-4 h-4" sw={2} />
          </button>
        </header>

        <div className="modal-body">
          <div className="space-y-2.5">
            {history.map((item) => {
              const isOriginal = item.id === originalId;
              return (
                <div key={item.id}
                  className="rounded-2xl border p-4 transition-colors"
                  style={{
                    background: isOriginal ? 'var(--blue-soft)' : 'var(--bg-card)',
                    borderColor: isOriginal ? 'var(--blue-light)' : 'var(--border-soft)',
                  }}>
                  {/* Top row: datetime + designer + 원본 pill */}
                  <div className="flex items-baseline justify-between gap-3 mb-2.5 flex-wrap">
                    <div className="flex items-baseline gap-2 min-w-0">
                      <span className="font-mono text-[var(--ink)] flex-shrink-0"
                        style={{ fontWeight: 700, fontSize: 13, letterSpacing: '-0.01em' }}>
                        {fmtDateTime(item.createdAt)}
                      </span>
                      {isOriginal && (
                        <span className="text-[9.5px] px-2 rounded-full flex-shrink-0"
                          style={{ background: 'var(--blue)', color: 'white', fontWeight: 800, lineHeight: '16px', letterSpacing: '0.02em' }}>
                          원본
                        </span>
                      )}
                    </div>
                    <span className="text-[12.5px] text-[var(--ink)] flex-shrink-0" style={{ fontWeight: 700 }}>
                      {item.designer}
                    </span>
                  </div>
                  {/* Detail rows */}
                  <div className="space-y-1" style={{ fontSize: 12 }}>
                    <Row k="컬러·사이즈" v={(item.colorSize || []).length ? item.colorSize.join(' / ') : '-'} />
                    <Row k="수량" v={item.quantity} accent />
                    {item.notes && <Row k="비고" v={item.notes} />}
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <footer className="modal-footer">
          <p className="text-[11px] text-[var(--ink-faint)] font-mono" style={{ fontWeight: 500 }}>
            최신순 정렬 · ESC 키로 닫기
          </p>
          <button type="button" onClick={onClose} className="btn-ghost"
            style={{ padding: '7px 14px', fontSize: 12 }}>
            닫기
          </button>
        </footer>
      </div>
    </div>
  ), document.body);
}

function OrderScreen({ orders, addOrder, deleteOrder, toggleComplete, updateOrder, showToast }) {

  const [scope, setScope] = useState('active');

  const submit = (e) => {
    e && e.preventDefault();
    if (!form.quantity.trim() || !form.designer.trim()) {
      showToast('수량과 디자이너 이름을 입력해주세요', 'sparkle'); return;
    }
    addOrder({ ...form, id: uid(), createdAt: new Date().toISOString(), completedAt: null });
    setForm(emptyForm);
    showToast('발주 요청이 등록되었어요', 'check', 'blue');
  };

  // 대기 중 = 미완료 OR 오늘 완료된 것  (어제 이전에 완료된 항목은 자동 제외)
  const active = useMemo(() => {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    return orders.filter((o) => {
      if (!o.completedAt) return true;
      return new Date(o.completedAt) >= t;
    });
  }, [orders]);
  const list = scope === 'active' ? active : orders;
  const completedTodayCount = active.filter((o) => o.completedAt).length;

  return (
    <div className="fade-up space-y-14">
      <PageHeader
        eyebrow="01 · ORDER REQUEST"
        title="샘플 발주"
        sub="등록 시 자동으로 샘플 아카이브에 저장됩니다"
        right={(() => {
          const t = new Date();
          const dayNames = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
          const dow = t.getDay();
          const isOrderDay = dow === 2 || dow === 4;

            <div className="flex items-baseline gap-3 px-5 py-3 rounded-2xl border"

                borderColor: isOrderDay ? '#FECACA' : 'var(--border)',
                boxShadow: 'var(--shadow-xs)'
              }}>
              <p className="font-mono"
                style={{ fontWeight: 800, fontSize: 20, color: accent, letterSpacing: '-0.025em' }}>
                {formatDate(t.toISOString())}
              </p>
              <p className="flex items-center gap-1.5"
                style={{ fontWeight: 700, fontSize: 13, color: isOrderDay ? '#DC2626' : 'var(--ink-muted)' }}>
                {isOrderDay && <span className="w-1.5 h-1.5 rounded-full bg-current pulse-dot"></span>}
                {dayNames[dow]}
                {isOrderDay && <span className="opacity-70">· 발주일</span>}

        })()}
      />

              onChange={(e) => setForm({ ...form, productUrl: e.target.value })}
              placeholder="https://detail.1688.com/offer/..."
              className="input-blue font-mono text-xs" />
            <p className="text-xs text-[var(--ink-faint)] mt-2 flex items-center gap-1.5" style={{ fontWeight: 500 }}>
              <Icon name="external" className="w-3 h-3 text-[var(--blue)]" sw={2.2} />
              저장 후 카드에서 [1688 바로가기] 버튼으로 새 창에서 열 수 있어요
            </p>
          </Field>

          <Field n="02" label={<>샘플 사진 <span className="text-[var(--ink-faint)]" style={{ fontWeight: 400 }}>(최대 5장)</span></>}>

          <Field n="03" label="카테고리">
            <div className="space-y-4">
              <div>
                <p className="text-xs text-[var(--ink-muted)] mb-2.5" style={{ fontWeight: 600, letterSpacing: '-0.005em' }}>시즌</p>
                <div className="flex flex-wrap gap-1.5">
                  {SEASONS.map((s) => (
                    <FilterPill key={s} active={form.season === s}
                      onClick={() => setForm({ ...form, season: s })}
                      color={form.season === s ? { bg: SEASON_STYLE[s].bg, fg: SEASON_STYLE[s].fg } : null}>
                      <span style={{ fontSize: 10 }}>{SEASON_STYLE[s].emoji}</span>{s}
                    </FilterPill>
                  ))}
                </div>

              <button onClick={() => setScope('all')}

          <EmptyState icon={orders.length > 0 && scope === 'active' ? 'check' : 'inbox'}>

function PendingGrid({ items, onDelete, onToggleComplete, onUpdate, showToast }) {
  const [editingId, setEditingId] = useState(null);

  return (
    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 items-start">
      {items.map((o, i) => (
        editingId === o.id ? (
          <PendingCardEdit
            key={o.id}
            order={o}
            onSave={(updated) => {
              onUpdate(updated);
              setEditingId(null);
              showToast('수정이 완료되었어요', 'check', 'blue');
            }}
            onCancel={() => setEditingId(null)}
            showToast={showToast}
          />
        ) : (
          <PendingCardView
            key={o.id}
            order={o}
            index={i}
            onEdit={() => setEditingId(o.id)}
            onDelete={onDelete}
            onToggleComplete={onToggleComplete}
          />
        )
      ))}
    </div>
  );
}

function PendingCardEdit({ order, onSave, onCancel, showToast, mode = 'edit' }) {
  const [form, setForm] = useState(() => {
    const f = { ...order };
    // Migrate legacy single `image` → `images` array
    if (!Array.isArray(f.images)) {
      f.images = f.image ? [f.image] : [];
    }
    return f;
  });

  useEffect(() => {
    const handler = (e) => { if (e.key === 'Escape') onCancel(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, [onCancel]);

  const submit = (e) => {
    e && e.preventDefault();
    if (!form.quantity.trim() || !form.designer.trim()) {
      showToast('수량과 디자이너 이름을 입력해주세요', 'sparkle'); return;
    }
    onSave(form);
  };

  const labelCls = "text-[10.5px] text-[var(--ink-muted)] mb-1.5 block";
  const labelStyle = { fontWeight: 600, letterSpacing: '-0.005em' };

  const isRequest = mode === 'request';
  const headerTitle = isRequest ? '샘플 재요청 등록' : '샘플 수정 중';
  const headerIcon = isRequest ? 'plus' : 'pencil';
  const submitLabel = isRequest ? '발주 요청 등록' : '저장';

  return (
    <form onSubmit={submit}
      className="card-bento p-5 fade-up lg:col-span-2"
      style={{
        borderColor: 'var(--blue)',
        boxShadow: '0 0 0 3px var(--blue-ring), var(--shadow-lg)'
      }}>
      {/* Header */}
      <div className="flex items-center justify-between mb-4 pb-3 border-b border-[var(--border-soft)]">
        <div className="flex items-center gap-2">
          <div className="w-7 h-7 rounded-xl bg-[var(--blue-soft)] text-[var(--blue)] flex items-center justify-center">
            <Icon name={headerIcon} className="w-3.5 h-3.5" sw={2.2} />
          </div>
          <div>
            <h4 className="text-sm text-[var(--ink)]" style={{ fontWeight: 700, letterSpacing: '-0.02em' }}>{headerTitle}</h4>
            {isRequest && <p className="text-[10px] text-[var(--ink-muted)] mt-0.5" style={{ fontWeight: 500 }}>내용을 수정하고 새 발주로 등록할 수 있어요</p>}
          </div>
        </div>
        <button type="button" onClick={onCancel}
          className="w-7 h-7 rounded-lg flex items-center justify-center text-[var(--ink-muted)] hover:bg-[var(--bg-alt)] hover:text-[var(--ink)] transition-all"
          aria-label="취소">
          <Icon name="x" className="w-3.5 h-3.5" sw={2} />
        </button>
      </div>

      {/* Fields */}
      <div className="space-y-3.5">
        {/* Image */}
        <div>
          <label className={labelCls} style={labelStyle}>샘플 사진 <span className="text-[var(--ink-faint)]" style={{ fontWeight: 400 }}>(최대 5장)</span></label>
          <MultiImageInput value={form.images} onChange={(v) => setForm({ ...form, images: v })} max={5} />
        </div>

        {/* Season */}
        <div>
          <label className={labelCls} style={labelStyle}>시즌</label>
          <div className="flex flex-wrap gap-1">
            {SEASONS.map((s) => (
              <FilterPill key={s} active={form.season === s}
                onClick={() => setForm({ ...form, season: s })}
                color={form.season === s ? { bg: SEASON_STYLE[s].bg, fg: SEASON_STYLE[s].fg } : null}>
                <span style={{ fontSize: 10 }}>{SEASON_STYLE[s].emoji}</span>{s}
              </FilterPill>
            ))}
          </div>
        </div>

        {/* Type */}
        <div>
          <label className={labelCls} style={labelStyle}>종류</label>
          <div className="flex flex-wrap gap-1">
            {TYPES.map((t) => (
              <FilterPill key={t} active={form.type === t}
                onClick={() => setForm({ ...form, type: t })}>{t}</FilterPill>
            ))}
          </div>
        </div>

        {/* Designer */}
        <div>
          <label className={labelCls} style={labelStyle}>요청 디자이너</label>
          <input type="text" value={form.designer}
            onChange={(e) => setForm({ ...form, designer: e.target.value })}
            placeholder="디자이너 이름"
            className="input-blue text-xs"
            style={{ padding: '9px 13px' }} />
        </div>

        {/* Quantity */}
        <div>
          <label className={labelCls} style={labelStyle}>발주 수량</label>
          <input type="text" value={form.quantity}
            onChange={(e) => setForm({ ...form, quantity: e.target.value })}
            placeholder="예) 3야드, 50개"
            className="input-blue text-xs"
            style={{ padding: '9px 13px' }} />
        </div>

        {/* Color/Size */}
        <div>
          <label className={labelCls} style={labelStyle}>컬러·사이즈</label>
          <TagInput value={form.colorSize || []}
            onChange={(v) => setForm({ ...form, colorSize: v })}
            placeholder="컬러 / 사이즈 추가…" />
        </div>

        {/* Notes */}
        <div>
          <label className={labelCls} style={labelStyle}>비고</label>
          <input type="text" value={form.notes}
            onChange={(e) => setForm({ ...form, notes: e.target.value })}
            placeholder="제품 스타일 · 아이템명"
            className="input-blue text-xs"
            style={{ padding: '9px 13px' }} />
        </div>

        {/* Product URL */}
        <div>
          <label className={labelCls} style={labelStyle}>1688 제품 링크</label>
          <input type="url" value={form.productUrl || ''}
            onChange={(e) => setForm({ ...form, productUrl: e.target.value })}
            placeholder="https://detail.1688.com/..."
            className="input-blue font-mono"
            style={{ padding: '9px 13px', fontSize: 11 }} />
        </div>
      </div>

      {/* Footer */}
      <div className="flex items-center justify-end gap-2 mt-5 pt-4 border-t border-[var(--border-soft)]">
        <button type="button" onClick={onCancel} className="btn-ghost"
          style={{ padding: '7px 14px', fontSize: 12 }}>취소</button>
        <button type="submit" className="btn-electric"
          style={{ padding: '7px 14px', fontSize: 12 }}>
          <Icon name={isRequest ? 'plus' : 'check'} className="w-3 h-3" sw={2.4} />
          {submitLabel}
        </button>
      </div>
    </form>
  );
}
